name: Airtable Connectivity Test
on:
  workflow_dispatch: {}

jobs:
  test-airtable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Push 3 test rows (matches your Leads schema)
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          # Set CLEAR_ALL to "1" if you want to wipe the table before inserting test rows
          CLEAR_ALL: "0"
          # Set INCLUDE_FLAGS to "1" **only if** you created a "Flags" field in Airtable
          INCLUDE_FLAGS: "0"
        run: |
          python - <<'PY'
          import os, sys, time, json, datetime, requests, urllib.parse

          API_KEY = os.getenv("AIRTABLE_API_KEY")
          BASE_ID = os.getenv("AIRTABLE_BASE_ID")
          TABLE   = os.getenv("AIRTABLE_TABLE_NAME", "Leads")
          CLEAR   = os.getenv("CLEAR_ALL", "0") == "1"
          INCFLAG = os.getenv("INCLUDE_FLAGS", "0") == "1"

          if not (API_KEY and BASE_ID and TABLE):
            print("Missing AIRTABLE_API_KEY / AIRTABLE_BASE_ID / AIRTABLE_TABLE_NAME"); sys.exit(1)

          base_url = f"https://api.airtable.com/v0/{BASE_ID}/{urllib.parse.quote(TABLE)}"
          headers = {"Authorization": f"Bearer {API_KEY}", "Content-Type": "application/json"}

          def list_ids():
              ids = []
              url = base_url
              while True:
                  r = requests.get(url, headers=headers, timeout=30)
                  if r.status_code >= 300:
                      print("List error:", r.status_code, r.text); sys.exit(1)
                  data = r.json()
                  ids.extend([rec["id"] for rec in data.get("records", [])])
                  offset = data.get("offset")
                  if not offset: break
                  url = f"{base_url}?offset={offset}"
              return ids

          def delete_batch(ids):
              if not ids: return
              params = "&".join(f"records[]={urllib.parse.quote(i)}" for i in ids)
              url = f"{base_url}?{params}"
              r = requests.delete(url, headers=headers, timeout=30)
              if r.status_code >= 300:
                  print("Delete error:", r.status_code, r.text); sys.exit(1)

          if CLEAR:
              print("Clearing Airtable table...")
              ids = list_ids()
              for i in range(0, len(ids), 10):
                  delete_batch(ids[i:i+10])
                  time.sleep(0.2)
              print("All records cleared.")

