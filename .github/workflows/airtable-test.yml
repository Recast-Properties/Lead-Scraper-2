name: Airtable Test

on:
  workflow_dispatch:

jobs:
  test-airtable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Airtable client
        run: |
          pip install airtable-python-wrapper

      - name: Clear table and push test rows
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        run: |
          python - <<'PY'
          import os
          from airtable import Airtable

          BASE_ID = os.getenv("AIRTABLE_BASE_ID")
          TABLE_NAME = os.getenv("AIRTABLE_TABLE_NAME", "Leads")
          API_KEY = os.getenv("AIRTABLE_API_KEY")

          at = Airtable(BASE_ID, TABLE_NAME, API_KEY)

          # Clear existing rows
          print("Clearing Airtable table...")
          while True:
              records = at.get_all(page_size=100)
              if not records:
                  break
              for rec in records:
                  at.delete(rec['id'])
          print("All records cleared.")

          # Insert test rows
          test_data = [
              {"Name": "Alice Johnson", "Phone": "555-1234", "Address": "123 Main St", "Motivation": "Behind on payments"},
              {"Name": "Bob Smith", "Phone": "555-5678", "Address": "456 Oak Ave", "Motivation": "Inherited property"},
              {"Name": "Carol Lee", "Phone": "555-9012", "Address": "789 Pine Rd", "Motivation": "Tired landlord"},
          ]
          for row in test_data:
              at.insert(row)
          print("3 test rows inserted into Airtable.")
          PY
