name: PropertyReach Autocomplete Probe

on:
  workflow_dispatch: {}   # run manually from the Actions tab

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Call suggestions endpoint (Portland)
        env:
          PR_API_KEY: ${{ secrets.PR_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, requests, sys
          key = os.getenv("PR_API_KEY")
          if not key:
            print("Missing PR_API_KEY"); sys.exit(1)

          url = "https://api.propertyreach.com/v1/suggestions"  # documented suggestions endpoint
          headers = {"x-api-key": key, "Content-Type": "application/json"}
          body = {"query": "Portland OR", "limit": 5}

          r = requests.post(url, headers=headers, data=json.dumps(body), timeout=30)
          print("Status:", r.status_code)
          try:
              data = r.json()
              print("JSON:", json.dumps(data, indent=2)[:2000])
          except Exception:
              print("Text:", r.text[:2000])
          PY
