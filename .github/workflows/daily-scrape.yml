name: Daily Craigslist Scrape

on:
  schedule:
    - cron: "10 13 * * *"   # ~6:10 AM America/Los_Angeles during DST
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --no-cache-dir

      - name: Run scraper with Airtable
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          # Proof-of-life knobs; revert after you confirm data flows
          PUSH_ALL: "1"   # change to "0" later
          MIN_SCORE: "4"  # change to "6" later
        run: |
          python scraper.py
          echo "--- OUTPUT TREE ---"
          ls -la
          echo "--- OUTPUT DIR ---"
          ls -la output || true

      - name: Upload results as artifact
        if: always()  # try to upload even if previous step warns
        uses: actions/upload-artifact@v4
        with:
          name: craigslist-reports
          path: output/*.csv
          if-no-files-found: warn
