      - name: Run scraper with Airtable
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          PUSH_ALL: "1"         # set to "1" to push ALL leads instead of only hot
          MIN_SCORE: "6"        # lower to "4" temporarily if you want more to pass
        run: |
          python scraper.py
          echo "--- OUTPUT DIR TREE ---"
          ls -la
          echo "--- OUTPUT SUBDIR ---"
          ls -la output || true

      - name: Upload CSV artifacts
        if: always()  # try to upload even if previous step had no files
        uses: actions/upload-artifact@v4
        with:
          name: craigslist-reports
          path: output/*.csv
          if-no-files-found: warn
