name: PropertyReach → Airtable [Multi-Variant Debug]

on:
  workflow_dispatch: {}
  schedule:
    - cron: "25 13 * * *"   # ~6:25am PT during DST

jobs:
  pr-to-airtable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Query PropertyReach (3 variants), map, and push to Airtable
        env:
          PR_API_KEY: ${{ secrets.PR_API_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          CITY: "Portland"
          STATE: "OR"
          LIMIT: "50"
          MIN_SCORE: "0"
        run: |
          python - <<'PY'
          import os, json, requests, datetime, sys, time, urllib.parse

          PR_KEY = os.getenv("PR_API_KEY")
          AT_KEY = os.getenv("AIRTABLE_API_KEY")
          AT_BASE = os.getenv("AIRTABLE_BASE_ID")
          AT_TABLE = os.getenv("AIRTABLE_TABLE_NAME", "Leads")
          CITY = os.getenv("CITY","Portland")
          STATE = os.getenv("STATE","OR")
          LIMIT = int(os.getenv("LIMIT","50"))
          MIN_SCORE = int(os.getenv("MIN_SCORE","0"))

          if not (PR_KEY and AT_KEY and AT_BASE and AT_TABLE):
              print("Missing PR_API_KEY or Airtable secrets."); sys.exit(1)

          pr_url = "https://api.propertyreach.com/v1/search"
          headers = {"x-api-key": PR_KEY, "Content-Type": "application/json"}

          def call_and_parse(label, body):
              print(f"\n=== VARIANT {label} ===")
              print("[REQUEST]", json.dumps(body, indent=2)[:1000])
              r = requests.post(pr_url, headers=headers, data=json.dumps(body), timeout=60)
              print("[STATUS]", r.status_code)
              try:
                  data = r.json()
              except Exception:
                  print("[RAW RESPONSE]", r.text[:2000])
                  return []
              print("[TOP-LEVEL KEYS]", list(data.keys()) if isinstance(data, dict) else type(data))
              # Accept common containers
              props = []
              if isinstance(data, dict):
                  for key in ("properties","results"):
                      if isinstance(data.get(key), list):
                          props = data[key]; break
                  if not props and isinstance(data.get("data"), dict):
                      dd = data["data"]
                      for key in ("properties","results"):
                          if isinstance(dd.get(key), list):
                              props = dd[key]; break
              elif isinstance(data, list):
                  props = data
              print("[COUNT]", len(props))
              if props:
                  print("[FIRST ITEM KEYS]", list(props[0].keys()))
                  print("[FIRST ITEM EXCERPT]", json.dumps(props[0], default=str)[:800])
              return props

          # Variant A: city/state filter
          varA = {
            "city": CITY,
            "state": STATE,
            "filter": {
              # intentionally minimal; add others later when we know shape
            },
            "options": {"limit": LIMIT}
          }

          # Variant B: single location string (some APIs prefer 'location' or 'query')
          varB = {
            "location": f"{CITY}, {STATE}",
            "options": {"limit": LIMIT}
          }

          # Variant C: no location filters, just a limit (to test if key/environment works)
          varC = {
            "options": {"limit": LIMIT}
          }

          all_rows = []
          labels = []
          for label, body in (("A city/state", varA), ("B location", varB), ("C minimal", varC)):
              props = call_and_parse(label, body)
              if not props:
                  continue
              labels.append(label)
              # generic mapper (we’ll refine after we see keys)
              def val(x, default=""):
                  return default if x is None else x
              def as_price(v):
                  try:
                      return f"${int(float(v)):,}"
                  except: return ""
              def score(p):
                  s=0; flags=[]
                  for k in ("vacant","taxDelinquency","priceReduced"):
                      if p.get(k) is True: s+=2; flags.append(k)
                  try:
                      dom=int(p.get("daysOnMarket") or 0)
                      if dom>=0: s+=1; flags.append(f"DOM={dom}")
                  except: pass
                  try:
                      eq=float(p.get("estimatedEquityRatio") or 0.0)
                      if eq>=0.3: s+=1; flags.append("equity>=30%")
                  except: pass
                  return min(s,10), ",".join(flags)

              today = datetime.date.today().isoformat()
              for p in props:
                  street = p.get("streetAddress") or p.get("address") or ""
                  city = p.get("city") or CITY
                  state = p.get("state") or STATE
                  zipc = p.get("zip") or p.get("zipcode") or ""
                  title = ", ".join([x for x in [street, city, state, zipc] if x])
                  price = as_price(p.get("estimatedValue") or p.get("valuation"))
                  s, flags = score(p)
                  all_rows.append({
                    "Date Found": today,
                    "Source": f"PropertyReach [{label}]",
                    "Title": title or "PropertyReach Lead",
                    "URL": f"PR:{p.get('id') or p.get('propertyId') or ''}",
                    "Price": price,
                    "Neighborhood": val(p.get("subdivision") or p.get("neighborhood") or p.get("landUse") or ""),
                    "Address": title,
                    "Description": f"status={val(p.get('listingStatus'))}, DOM={val(p.get('daysOnMarket',0))}",
                    "Score": s,
                    "Flags": flags,
                  })

          # If still nothing, insert a richer debug marker row
          if not all_rows:
              all_rows = [{
                  "Date Found": datetime.date.today().isoformat(),
                  "Source": "PropertyReach [DEBUG]",
                  "Title": "No results from any variant",
                  "URL": "PR:debug",
                  "Price": "",
                  "Neighborhood": "",
                  "Address": "Portland, OR",
                  "Description": "Check logs for [TOP-LEVEL KEYS] and try other filters/endpoints.",
                  "Score": 0,
                  "Flags": "debug",
              }]

          # Apply MIN_SCORE filter but allow debug marker through
          hot = [r for r in all_rows if (r["Score"] >= MIN_SCORE) or r["Source"].startswith("PropertyReach [DEBUG]")]
          print(f"Prepared {len(all_rows)} rows; {len(hot)} pass MIN_SCORE={MIN_SCORE}; from variants: {labels}")

          # Push to Airtable
          at_url = f"https://api.airtable.com/v0/{AT_BASE}/{urllib.parse.quote(AT_TABLE)}"
          at_headers = {"Authorization": f"Bearer {AT_KEY}", "Content-Type": "application/json"}

          def to_airtable(rec): return {"fields": rec}

          count=0
          for i in range(0, len(hot), 10):
              payload = {"records":[to_airtable(x) for x in hot[i:i+10]], "typecast": True}
              rr = requests.post(at_url, headers=at_headers, data=json.dumps(payload), timeout=60)
              if rr.status_code >= 300:
                  print("Airtable error:", rr.status_code, rr.text); sys.exit(1)
              count += len(payload["records"]); time.sleep(0.25)

          print(f"[✓] Pushed {count} rows to Airtable.")
          PY
