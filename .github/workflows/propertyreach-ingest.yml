name: PropertyReach → Airtable (Portland distressed)

on:
  workflow_dispatch: {}     # run manually while testing
  schedule:
    - cron: "25 13 * * *"   # daily @ 13:25 UTC (~6:25am PT during DST)

jobs:
  pr-to-airtable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch from PropertyReach, score, and push to Airtable
        env:
          PR_API_KEY: ${{ secrets.PR_API_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          CITY: "Portland"
          STATE: "OR"
          LIMIT: "50"
          DAYS_ON_MARKET_MIN: "30"
          WANT_VACANT: "true"           # change to "false" if you want all
          WANT_TAX_DELINQUENT: "true"   # change to "false" if you want all
          WANT_PRICE_REDUCED: "true"    # change to "false" if you want all
          MIN_SCORE: "6"                # leads with score >= MIN_SCORE go to Airtable
        run: |
          python - <<'PY'
          import os, json, requests, datetime, sys, time, math, urllib.parse

          # --- Config/env
          PR_KEY = os.getenv("PR_API_KEY")
          CITY = os.getenv("CITY", "Portland")
          STATE = os.getenv("STATE", "OR")
          LIMIT = int(os.getenv("LIMIT", "50"))
          dom_min = int(os.getenv("DAYS_ON_MARKET_MIN", "30"))
          want_vacant = os.getenv("WANT_VACANT", "true").lower() == "true"
          want_tax = os.getenv("WANT_TAX_DELINQUENT", "true").lower() == "true"
          want_price_drop = os.getenv("WANT_PRICE_REDUCED", "true").lower() == "true"
          min_score = int(os.getenv("MIN_SCORE", "6"))

          AT_KEY = os.getenv("AIRTABLE_API_KEY")
          AT_BASE = os.getenv("AIRTABLE_BASE_ID")
          AT_TABLE = os.getenv("AIRTABLE_TABLE_NAME", "Leads")

          if not (PR_KEY and AT_KEY and AT_BASE and AT_TABLE):
              print("Missing one or more secrets (PR_API_KEY / AIRTABLE_*)."); sys.exit(1)

          # --- Call PropertyReach Search API
          # Docs: POST https://api.propertyreach.com/v1/search with x-api-key header (JSON body). :contentReference[oaicite:1]{index=1}
          pr_url = "https://api.propertyreach.com/v1/search"
          headers = {"x-api-key": PR_KEY, "Content-Type": "application/json"}

          body = {
            "city": CITY,
            "state": STATE,
            "filter": {
              "daysOnMarketMin": dom_min,
              "vacant": True if want_vacant else None,
              "taxDelinquency": True if want_tax else None,
              "priceReduced": True if want_price_drop else None,
              # You can add more filters here (ownerOccupied=False, estimatedEquityMin, etc.)
            },
            "options": {"limit": LIMIT}
          }

          # Remove None filters so we don't overconstrain
          body["filter"] = {k:v for k,v in body["filter"].items() if v is not None}

          r = requests.post(pr_url, headers=headers, data=json.dumps(body), timeout=60)
          if r.status_code >= 300:
              print("PropertyReach error:", r.status_code, r.text); sys.exit(1)
          data = r.json()

          props = data.get("properties", [])
          print(f"[*] PropertyReach returned {len(props)} properties (limit={LIMIT})")

          # --- Score & map to Airtable schema
          # Response fields per docs include things like: streetAddress, city, state, zip, estimatedValue, daysOnMarket, listingStatus, id, etc. :contentReference[oaicite:2]{index=2}
          today = datetime.date.today().isoformat()
          def val(x, default=""):
              return default if x is None else x

          def score_row(p):
              s = 0
              flags = []
              # Price reduced
              if val(p.get("listingStatus")) in ("Active","Pending","Contingent") and bool(body["filter"].get("priceReduced", False)):
                  s += 2; flags.append("price_reduced")
              # Vacant
              if p.get("vacant") is True or body["filter"].get("vacant") is True:
                  s += 2; flags.append("vacant")
              # Tax delinquent
              if p.get("taxDelinquency") is True or body["filter"].get("taxDelinquency") is True:
                  s += 2; flags.append("tax_delinquent")
              # DOM
              try:
                  dom = int(p.get("daysOnMarket") or 0)
                  if dom >= dom_min: s += 1; flags.append(f"DOM>={dom_min}")
              except: pass
              # Equity (if present)
              try:
                  eq = float(p.get("estimatedEquityRatio") or 0.0)  # 0..1
                  if eq >= 0.3: s += 1; flags.append("equity>=30%")
              except: pass
              return min(s, 10), ",".join(flags)

          rows = []
          for p in props:
              title = f"{val(p.get('streetAddress'))}, {val(p.get('city'))}, {val(p.get('state'))} {val(p.get('zip'))}".strip(", ")
              price = ""
              try:
                  ev = p.get("estimatedValue")
                  price = f"${int(ev):,}" if isinstance(ev, (int, float)) else ""
              except: pass

              s, flags = score_row(p)

              rows.append({
                  "Date Found": today,
                  "Source": "PropertyReach",
                  "Title": title or "PropertyReach Lead",
                  "URL": f"PR:{p.get('id')}",   # PropertyReach may not include a public URL; track the id
                  "Price": price,
                  "Neighborhood": val(p.get("subdivision") or p.get("landUse") or ""),
                  "Address": title,
                  "Description": f"status={val(p.get('listingStatus'))}, DOM={val(p.get('daysOnMarket',0))}",
                  "Score": s,
                  "Flags": flags,
              })

          # Filter by MIN_SCORE
          hot = [r for r in rows if r["Score"] >= min_score]
          print(f"[*] Scored {len(rows)} rows; {len(hot)} are >= {min_score}")

          if not hot:
              print("[i] No rows met the score threshold. Exiting without Airtable insert.")
              sys.exit(0)

          # --- Push to Airtable
          at_url = f"https://api.airtable.com/v0/{AT_BASE}/{urllib.parse.quote(AT_TABLE)}"
          at_headers = {"Authorization": f"Bearer {AT_KEY}", "Content-Type": "application/json"}

          # batch in chunks of 10
          def to_airtable(rec):
              return {"fields": rec}

          count = 0
          for i in range(0, len(hot), 10):
              payload = {"records": list(map(to_airtable, hot[i:i+10])), "typecast": True}
              rr = requests.post(at_url, headers=at_headers, data=json.dumps(payload), timeout=60)
              if rr.status_code >= 300:
                  print("Airtable error:", rr.status_code, rr.text); sys.exit(1)
              count += len(payload["records"])
              time.sleep(0.25)

          print(f"[✓] Pushed {count} hot leads to Airtable.")
          PY

      - name: Upload any CSV artifacts (optional placeholder)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propertyreach-run-log
          path: |
            # we didn't write CSVs in this job; this is just a placeholder if you add them later
          if-no-files-found: ignore
